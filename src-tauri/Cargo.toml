[package]
name = "stelix-file-manager"
version = "0.1.0"
description = "Stelix File Manager 星索"
authors = ["Stelix"]
edition = "2021"

[lib]
# Windows 上 lib 与 bin 同名会冲突，故加 _lib 后缀
name = "stelix_file_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon：系统托盘支持（托盘图标 + 右键菜单），用于「关闭窗口最小化到托盘」
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
# dialog：远程传输时选择本地上传文件 / 下载目标目录（官方插件）
tauri-plugin-dialog = "2"
# autostart：开机自启动（Windows 写 HKCU\...\Run 注册表项）
tauri-plugin-autostart = "2"
# single-instance：保证整个系统只运行一个实例，重复启动时唤起已有窗口
tauri-plugin-single-instance = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 异步 / 并发
tokio = { version = "1", features = ["sync", "time", "macros"] }
rayon = "1"
dashmap = "6"
parking_lot = "0.12"
once_cell = "1"

# 文件系统遍历
walkdir = "2"

# AI 接入（Windows 走 SChannel，无需额外 C 依赖）
reqwest = { version = "0.12", features = ["json", "stream"] }

# 工具
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
uuid = { version = "1", features = ["v4", "serde"] }
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }

# 系统图标：HICON -> 像素 -> PNG 编码 / base64（见 shell_icon.rs）
png = "0.17"
base64 = "0.22"

# Windows 原生能力（驱动器信息 / MFT 预留 / 系统图标）
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_NetworkManagement_WNet",
    "Win32_NetworkManagement_NetManagement",
    "Win32_System_Registry",
    "Win32_System_Com",
    "Win32_System_Memory",
    "Win32_System_DataExchange",
    "Win32_System_Ole",
    "Win32_Graphics_Gdi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    # 提权子进程等待（WaitForSingleObject / GetExitCodeProcess）
    "Win32_System_Threading",
] }
rusqlite = { version = "0.40.2", features = ["bundled", "cache"], default-features = false }
notify = "8.2.0"

# Windows Shell 原生右键菜单（IContextMenu / TrackPopupMenuEx）
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# 开发构建也开启一定优化：索引/检索是 CPU 密集路径，
# opt-level=0 会让"秒级检索"在 dev 下明显变慢。
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
