[package]
name = "stelix-file-manager"
version = "0.2.0"
description = "Stelix File Manager 星索"
authors = ["Stelix"]
edition = "2021"

[lib]
# Windows 上 lib 与 bin 同名会冲突，故加 _lib 后缀
name = "stelix_file_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon：系统托盘支持（托盘图标 + 右键菜单），用于「关闭窗口最小化到托盘」
# protocol-asset：预览弹窗直接以流式方式加载图片 / PDF（tauri.conf.json 的 assetProtocol）
tauri = { version = "2", features = ["tray-icon", "protocol-asset", "macos-private-api"] }
tauri-plugin-opener = "2"
# dialog：远程传输时选择本地上传文件 / 下载目标目录（官方插件）
tauri-plugin-dialog = "2"
# autostart：开机自启动（Windows 写 HKCU\...\Run 注册表项）
tauri-plugin-autostart = "2"
# single-instance：保证整个系统只运行一个实例，重复启动时唤起已有窗口
tauri-plugin-single-instance = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 异步 / 并发
tokio = { version = "1", features = ["sync", "time", "macros", "net", "io-util", "fs", "rt"] }
rayon = "1"
dashmap = { version = "6", features = ["rayon"] }
parking_lot = "0.12"
once_cell = "1"

# 文件系统遍历
walkdir = "2"

# AI 接入（Windows 走 SChannel，无需额外 C 依赖）；multipart 供网盘分片上传
reqwest = { version = "0.12", features = ["json", "stream", "multipart"] }

# 工具
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
uuid = { version = "1", features = ["v4", "serde"] }
keyring = { version = "3.6.3", default-features = false, features = ["apple-native", "windows-native"] }
# 文本预览：GBK / UTF-8 等编码解码（reqwest 已传递依赖同一版本）
encoding_rs = "0.8"

# SSH 终端：纯 Rust 客户端（ring 加密后端，避免额外 C/OpenSSL 依赖）
russh = { version = "0.65", default-features = false, features = ["ring", "rsa"] }
# SFTP 文件传输：与 SSH 终端共用 russh 连接（不依赖 curl 的 libssh2 主机密钥支持）
russh-sftp = "3"

# 系统图标：HICON -> 像素 -> PNG 编码 / base64（见 shell_icon.rs）
png = "0.17"
base64 = "0.22"

# 云存储：百度网盘分片 MD5、迅雷登录设备签名
md5 = "0.8"
sha1 = "0.11"
hex = "0.4"

rusqlite = { version = "0.40.2", features = ["bundled", "cache"], default-features = false }
notify = "8.2.0"
tauri-plugin-drag = "2.1.1"
# 删除文件：默认为「移到回收站 / 废纸篓」，跨平台由该 crate 处理
trash = "5"

# macOS / Linux 获取磁盘容量（statvfs）
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Windows 原生能力（驱动器信息 / MFT 预留 / 系统图标）
[target.'cfg(windows)'.dependencies]
everything-ipc = "0.1.4"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_NetworkManagement_WNet",
    "Win32_NetworkManagement_NetManagement",
    "Win32_System_Registry",
    "Win32_System_Com",
    "Win32_System_Memory",
    "Win32_System_DataExchange",
    "Win32_System_Ole",
    "Win32_Graphics_Gdi",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
    # 提权子进程等待（WaitForSingleObject / GetExitCodeProcess）
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    # 文件被占用时查占用进程（Restart Manager，见 file_locks.rs）
    "Win32_System_RestartManager",
] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSWorkspace", "NSImage", "NSBitmapImageRep"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSData", "NSDictionary"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# 开发构建也开启一定优化：索引/检索是 CPU 密集路径，
# opt-level=0 会让"秒级检索"在 dev 下明显变慢。
[profile.dev]
opt-level = 1
incremental = true
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false
