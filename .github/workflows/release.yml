name: Release

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build & publish (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    # All builds update the same draft release; serialize them to avoid release asset races.
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            args: --bundles nsis
          - name: macOS Apple Silicon
            os: macos-15
            args: --target aarch64-apple-darwin --bundles dmg
          - name: macOS Intel
            os: macos-15-intel
            args: --target x86_64-apple-darwin --bundles dmg
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 版本号以 tag 为准：同步到 package.json / tauri.conf.json / Cargo.toml，
      # 让 exe 元数据和安装包文件名都带正确版本。
      - name: Sync version from tag
        run: node scripts/sync-version.mjs "${{ github.ref_name }}"

      - name: Detect prerelease
        id: meta
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ "$TAG" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Stelix ${{ github.ref_name }}'
          releaseBody: |
            Windows x64 安装包（NSIS）和 macOS Apple Silicon / Intel 安装映像（DMG）。

            - Windows 安装包未做代码签名，首次运行时 SmartScreen 可能提示“未知发布者”。
            - macOS 安装包未做代码签名或公证，首次打开时可能需要在“隐私与安全性”中允许运行。
            - 发布页由 CI 以草稿形式创建，确认产物无误后再点击发布。

            提交记录：https://github.com/${{ github.repository }}/commits/${{ github.ref_name }}
          releaseDraft: true
          prerelease: ${{ steps.meta.outputs.prerelease }}
          tauriScript: pnpm tauri
          args: ${{ matrix.args }}
